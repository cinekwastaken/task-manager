services:
  postgres:
    image: postgres:15
    container_name: task_manager_postgres
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: task_manager_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data




volumes:
  postgres-data:
  redis-data:


